<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Goks Gold</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f0f2f5;--panel:#fff;--text:#111b21;--sub:#667781;--out:#d9fdd3;--in:#fff;--line:#e9edef;--accent:#00a884;--chat:#efeae2;--hover:#f5f6f6;--tick:#53bdeb;--head:#008069}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--panel:#111b21;--text:#e9edef;--sub:#8696a0;--out:#005c4b;--in:#202c33;--line:#222d34;--chat:#0b141a;--hover:#202c33;--head:#202c33}}
:root[data-theme="dark"]{--bg:#0b141a;--panel:#111b21;--text:#e9edef;--sub:#8696a0;--out:#005c4b;--in:#202c33;--line:#222d34;--chat:#0b141a;--hover:#202c33;--head:#202c33}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{display:flex;height:100%;max-width:1400px;margin:auto;background:var(--panel)}
#side{width:400px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat)}
.top{background:var(--head);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;flex:1}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:12px 4px;color:var(--sub);font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
#pane{flex:1;overflow-y:auto}
.search{padding:8px 12px}
.search input{width:100%;border:0;background:var(--bg);color:var(--text);padding:9px 14px;border-radius:10px;font:inherit;outline:none}
.row{display:flex;gap:12px;padding:10px 16px;align-items:center;cursor:pointer}
.row:hover,.row.on{background:var(--hover)}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px}
.rb{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:10px}
.r1{display:flex;justify-content:space-between;gap:8px}
.r1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1 small,.sub{color:var(--sub);font-size:12.5px}
.r2{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:3px}
.r2 span.p{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.badge{background:var(--accent);color:#fff;border-radius:12px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.tk{letter-spacing:-3px;color:var(--sub);font-size:13px}.tk.r{color:var(--tick)}
#hd{background:var(--panel);padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
#hd .av{width:40px;height:40px;font-size:16px}
#hd .t{flex:1;min-width:0}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.ic:hover{background:var(--hover)}
#msgs{flex:1;overflow-y:auto;padding:14px 6%;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;background:var(--panel);color:var(--sub);font-size:12px;padding:4px 12px;border-radius:8px;margin:6px 0}
.m{max-width:min(75%,520px);padding:6px 9px 4px;border-radius:9px;box-shadow:0 1px 1px rgba(0,0,0,.13);line-height:1.5;word-break:break-word;position:relative}
.m.out{align-self:flex-start;background:var(--out)}
.m.in{align-self:flex-end;background:var(--in)}
.m img{max-width:100%;border-radius:6px;display:block;margin-bottom:3px}
.m .mt{display:flex;gap:4px;justify-content:flex-end;font-size:11px;color:var(--sub);margin-top:2px}
.m.del{font-style:italic;color:var(--sub)}
.m .x{display:none;position:absolute;top:-12px;inset-inline-end:6px;background:var(--panel);border-radius:8px;padding:2px 8px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.3);color:#d33}
.m.sel .x{display:block}
#comp{background:var(--panel);padding:8px 10px;display:flex;gap:6px;align-items:center;position:relative}
#comp input[type=text]{flex:1;border:0;background:var(--bg);color:var(--text);padding:11px 16px;border-radius:22px;font:inherit;outline:none}
#send{background:var(--accent);color:#fff}
#emo{display:none;position:absolute;bottom:60px;inset-inline-start:10px;background:var(--panel);border-radius:12px;padding:8px;box-shadow:0 2px 12px rgba(0,0,0,.3);width:260px;flex-wrap:wrap;gap:2px}
#emo.on{display:flex}#emo button{font-size:24px;width:40px;height:40px}
#empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--sub);padding:20px}
#empty h2{color:var(--text);font-weight:400;margin-bottom:8px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:12px}
.sw input{accent-color:var(--accent);width:20px;height:20px}
.sec{padding:12px 16px 4px;color:var(--accent);font-weight:700;font-size:13px}
.ring{padding:2px;border-radius:50%;border:3px solid var(--accent)}.ring.seen{border-color:var(--sub)}
.ov{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.ov.on{display:flex}
#call{background:#0b141a}
#call .av{width:120px;height:120px;font-size:48px;margin-bottom:18px}
.hang{background:#e53935;width:64px;height:64px;border-radius:50%;font-size:26px;margin-top:40px}
#stv{background:#222}
#stv .bar{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:14px;height:3px;background:rgba(255,255,255,.3)}
#stv .bar i{display:block;height:100%;width:0;background:#fff}
#stv p{font-size:28px;font-weight:700;max-width:420px}
#back{display:none}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:30;display:none}
.tabs button{font-size:12.5px;padding:12px 2px}.box{background:var(--panel);color:var(--text);border-radius:16px;padding:22px;width:min(92vw,380px);display:flex;flex-direction:column;gap:12px;text-align:right;max-height:90vh;overflow:auto}.box input,.box select,.sw select{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:11px;border-radius:10px;font:inherit}.go{background:var(--accent);color:#fff;padding:12px;border-radius:10px;font-weight:700}
@media (max-width:760px){#side{width:100%;border:0}#main{display:none}#app.open #side{display:none}#app.open #main{display:flex}#back{display:grid}#msgs{padding:12px}}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:760px){body{background:var(--panel)}}
.sgrad{display:flex;gap:10px;flex-wrap:wrap}.sgrad button{width:44px;height:44px;border-radius:12px;border:3px solid transparent}.sgrad button.on{border-color:var(--text)}
.box textarea{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:11px;border-radius:10px;font:inherit;resize:vertical}
</style>


<div id="app">
 <section id="side">
  <div class="top"><button class="ic" id="acc" title="الحسابات">👤</button><h1>واتساب الذهبي <small style="font-size:11px;opacity:.8">Goks Gold</small></h1><button class="ic" id="net" title="قطع الإنترنت عن واتساب فقط">📶</button><button class="ic" id="thm" title="الوضع الليلي">🌓</button></div>
  <div class="tabs" id="tabs"></div>
  <div id="pane"></div>
 </section>
 <section id="main">
  <div id="empty"><div><h2>واتساب للويب</h2><p>اختر محادثة من القائمة وابدأ المراسلة.<br>الرسائل هنا تجريبية داخل الصفحة فقط.</p></div></div>
  <div id="chat" style="display:none;flex:1;flex-direction:column;min-height:0">
   <div id="hd"><button class="ic" id="back">→</button><div class="av" id="hav"></div><div class="t"><b id="hn"></b><div class="sub" id="hs"></div></div><button class="ic" id="cr" title="تكرار الرسائل">🔁</button><button class="ic" id="cv">📹</button><button class="ic" id="ca">📞</button><button class="ic" id="mm" title="المزيد">⋮</button></div>
   <div id="msgs"></div>
   <div id="comp"><div id="emo"></div><button class="ic" id="eb">😊</button><button class="ic" id="ab">📎</button><input type="file" id="fi" accept="image/*" hidden><input type="text" id="mi" placeholder="اكتب رسالة" autocomplete="off"><button class="ic" id="send">➤</button></div>
  </div>
 </section>
</div>
<div class="ov" id="call"><div class="av" id="cav"></div><h2 id="cn"></h2><p id="cs" class="sub" style="margin-top:6px"></p><button class="hang" id="hang">📞</button></div>
<div class="ov" id="stv"><div class="bar"><i id="sbar"></i></div><p id="stx"></p><small id="sby" style="margin-top:24px;opacity:.8"></small><button class="go" id="ssv" style="margin-top:16px;padding:10px 18px">⬇ حفظ الحالة</button></div>
<div class="ov on" id="login" style="background:#0b141a"><div class="box"><h2 style="color:#fbbf24">واتساب الذهبي (Goks Gold)</h2><p class="sub">النسخة المتقدمة · إعداد المهندس يوسف فرج</p><div id="ls1" style="display:flex;flex-direction:column;gap:12px"><input id="ph" dir="ltr" placeholder="+20 101 234 5678"><button class="go" id="lsend">إرسال كود التحقق (OTP)</button></div><div id="ls2" style="display:none;flex-direction:column;gap:12px"><p id="lc" class="sub"></p><input id="ot" dir="ltr" maxlength="4" placeholder="----"><button class="go" id="lok">تأكيد والدخول</button></div></div></div>
<div class="ov" id="lock" style="background:#0b141a"><div class="box"><h3>التطبيق مقفل</h3><input id="lp" type="password" maxlength="4" dir="ltr" placeholder="الرمز"><button class="go" id="lu">فتح</button></div></div>
<div class="ov" id="mod" style="background:rgba(0,0,0,.7)"><div class="box" id="mbox"></div></div>

<script>
document.documentElement.dir='rtl';document.documentElement.lang='ar';
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
const COL=['#d97706','#059669','#2563eb','#7c3aed','#db2777','#0891b2'];
let uid=100;
const C=[
 {id:1,name:'أحمد محمد',c:0,on:true,un:2,m:[{o:0,t:'السلام عليكم يا يوسف، هل النسخة جاهزة؟',h:'٠٣:٠٠ م'},{o:1,t:'وعليكم السلام، جاري الشغل عليها',h:'٠٣:٠٥ م',s:'r'},{o:0,t:'تمام، بانتظارك 👍',h:'٠٣:١٠ م'}]},
 {id:2,name:'محمود علي',c:1,on:false,un:0,m:[{o:0,t:'الكود شغال بدون أي مشاكل',h:'أمس'}]},
 {id:3,name:'ماما ❤️',c:4,on:true,un:1,m:[{o:0,t:'متنساش تعدي علينا النهاردة',h:'٠١:٢٠ م'}]},
 {id:4,name:'مجموعة المطورين',c:3,on:true,un:5,m:[{o:0,t:'مين هيراجع السيرفرات النهاردة؟',h:'الثلاثاء'}]},
 {id:5,name:'سارة حسن',c:2,on:false,un:0,m:[{o:1,t:'شكراً على المساعدة!',h:'الأحد',s:'d'}]}
];
const REP=['تمام 👍','حاضر','ماشي يا باشا','هبعتلك كمان شوية','ربنا يخليك','أيوه فعلاً','طيب نتكلم بعدين','😂😂','تسلم إيدك','أكيد!'];
const ST=[{n:'أحمد محمد',t:'الشغل الحلو بيبان في الآخر 💪',g:'linear-gradient(135deg,#0ea5e9,#6366f1)',h:'منذ ١٥ دقيقة',seen:0},{n:'سارة حسن',t:'صباح الخير ☀️',g:'linear-gradient(135deg,#f59e0b,#ef4444)',h:'منذ ساعة',seen:0},{n:'محمود علي',t:'يوم الجمعة أحلى يوم',g:'linear-gradient(135deg,#10b981,#047857)',h:'منذ ٣ ساعات',seen:0}];
const CALLS=[{n:'أحمد محمد',k:'in',h:'اليوم ٠٢:١٠ م',v:0},{n:'ماما ❤️',k:'miss',h:'اليوم ١٢:٠٠ م',v:1},{n:'محمود علي',k:'out',h:'أمس',v:0}];
const S={tab:'chats',cur:null,q:'',hideTicks:true,hideSeen:true,typing:null,hideTyping:true,antiDel:true,antiSt:true,anon:true,ext:true,hq:true,unl:true,appLock:false,accent:'green',font:'sans',wall:'plain',emoji:'apple',maxv:'1G',offline:false,shield:false,pin:'1234'};
const tg=(k,t,s)=>`<label class="sw"><div><b>${t}</b><div class="sub">${s}</div></div><input type="checkbox" data-k="${k}" ${S[k]?'checked':''}></label>`;
const sel=(k,t,o)=>`<label class="sw"><b>${t}</b><select data-s="${k}">${o.map(([v,l])=>`<option value="${v}" ${S[k]===v?'selected':''}>${l}</option>`).join('')}</select></label>`;
const extra=()=>tg('hideTyping','إخفاء "يكتب الآن"','لا يظهر للآخرين أنك تكتب')+tg('antiDel','منع حذف الرسائل','تبقى الرسالة عندك بعد حذف المرسل لها')+tg('antiSt','منع حذف الحالات','الاحتفاظ بالحالات المحذوفة')+tg('anon','مشاهدة الحالات سراً','لا يظهر اسمك عند المشاهدة')+tg('ext','حالة ساعة كاملة','رفع حالات حتى 60 دقيقة')+tg('hq','إرسال الصور بجودة أصلية','إلغاء الضغط')+tg('unl','مشاركة صور بلا حد','بدون حد للعدد')+tg('appLock','قفل التطبيق','الرمز الافتراضي 1234')+sel('accent','لون الثيم',[['gold','ذهبي'],['green','أخضر واتساب'],['emerald','زمردي'],['indigo','نيلي'],['cyberpunk','سايبر']])+sel('font','نوع الخط',[['sans','افتراضي'],['serif','مزخرف'],['mono','برمجي']])+sel('wall','خلفية المحادثة',[['plain','سادة'],['dots','منقطة']])+sel('emoji','شكل الإيموجي',[['apple','Apple'],['native','النظام']])+sel('maxv','أقصى حجم فيديو',[['64','64MB'],['1G','1GB']]);
const TABS=[['chats','الدردشات'],['status','الحالات'],['calls','المكالمات'],['tools','الأدوات'],['set','الإعدادات']];
const cur=()=>C.find(c=>c.id===S.cur);
const av=(c,cls='')=>`<div class="av ${cls}" style="background:${COL[c.c%6]}">${esc(c.name[0])}</div>`;
const tick=s=>s==='p'?'<span class="tk">🕓</span>':s==='s'?'<span class="tk">✓</span>':s==='d'?'<span class="tk">✓✓</span>':`<span class="tk ${S.hideTicks?'':'r'}">✓✓</span>`;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>e.style.display='none',2500)}
function renderTabs(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-k="${k}">${l}</button>`).join('');
 $('#tabs').onclick=e=>{const k=e.target.dataset.k;if(k){S.tab=k;renderTabs();renderPane()}}}
function renderPane(){
 const p=$('#pane');
 if(S.tab==='chats'){
  const list=C.filter(c=>c.name.includes(S.q));
  p.innerHTML=`<div class="search"><input id="q" placeholder="ابحث أو ابدأ محادثة" value="${esc(S.q)}"></div>`+list.map(c=>{const l=c.m[c.m.length-1];
   return `<div class="row ${S.cur===c.id?'on':''}" data-id="${c.id}">${av(c)}<div class="rb"><div class="r1"><b>${esc(c.name)}</b><small>${esc(l.h)}</small></div><div class="r2"><span class="p">${l.o&&!l.d?tick(l.s)+' ':''}${l.d?'🚫 تم حذف هذه الرسالة':l.i?'📷 صورة':esc(l.t)}</span>${c.un?`<span class="badge">${c.un}</span>`:''}</div></div></div>`}).join('');
  const q=$('#q');q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;renderPane();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  p.querySelectorAll('.row').forEach(r=>r.onclick=()=>openChat(+r.dataset.id));
 }else if(S.tab==='status'){
  p.innerHTML=`<div class="row" id="mine"><div class="av" style="background:var(--accent)">+</div><div class="rb"><b>حالتي</b><div class="sub">اضغط لإضافة حالة نصية</div></div></div><div class="sec">آخر التحديثات</div>`+ST.map((s,i)=>`<div class="row" data-i="${i}"><div class="ring ${s.seen?'seen':''}"><div class="av" style="background:${COL[i+1]}">${esc(s.n[0])}</div></div><div class="rb"><b>${esc(s.n)}</b><div class="sub">${s.h}</div></div></div>`).join('');
  $('#mine').onclick=()=>{const t=prompt('اكتب حالتك');if(t){ST.unshift({n:'حالتي',t,g:'linear-gradient(135deg,#00a884,#0b141a)',h:S.ext?'الآن (حالة ساعة)':'الآن',seen:1});renderPane()}};
  p.querySelectorAll('[data-i]').forEach(r=>r.onclick=()=>viewStatus(+r.dataset.i));
 }else if(S.tab==='tools'){
  p.innerHTML=`<div class="sec">أدوات المطور يوسف فرج</div><div class="row" id="t1"><div class="av" style="background:var(--accent)">📋</div><div class="rb"><b>مكرر الرسائل السريع</b><div class="sub">تكرار جملة داخل المحادثة بضغطة</div></div></div><div class="row" id="t2"><div class="av" style="background:#059669">🛡</div><div class="rb"><b>درع الحماية ضد الحظر ${S.shield?'(مفعل)':''}</b><div class="sub">وضع شكلي داخل التجربة، لا يحمي حساباً حقيقياً</div></div></div>`;
  $('#t1').onclick=spamUI;$('#t2').onclick=()=>{S.shield=!S.shield;renderPane();toast(S.shield?'تم تفعيل درع الحماية':'تم إيقاف الدرع')};
 }else if(S.tab==='calls'){
  p.innerHTML=CALLS.map((c,i)=>`<div class="row" data-i="${i}"><div class="av" style="background:${COL[i+2]}">${esc(c.n[0])}</div><div class="rb"><b style="${c.k==='miss'?'color:#e53935':''}">${esc(c.n)}</b><div class="sub">${c.k==='in'?'↙ واردة':c.k==='out'?'↗ صادرة':'↙ فائتة'} · ${c.h}</div></div><span style="font-size:20px">${c.v?'📹':'📞'}</span></div>`).join('');
  p.querySelectorAll('.row').forEach(r=>r.onclick=()=>startCall(CALLS[+r.dataset.i].n,CALLS[+r.dataset.i].v));
 }else{
  p.innerHTML=`<div class="row"><div class="av" style="background:var(--accent)">ي</div><div class="rb"><b>يوسف فرج</b><div class="sub">مرحباً، أنا أستخدم واتساب</div></div></div><div class="sec">الخصوصية</div>
  <label class="sw"><div><b>إخفاء آخر ظهور</b><div class="sub">لن يظهر لك آخر ظهور للآخرين أيضاً</div></div><input type="checkbox" id="s1" ${S.hideSeen?'checked':''}></label>
  <label class="sw"><div><b>إيصالات القراءة</b><div class="sub">عند إيقافها تبقى العلامتان رماديتين</div></div><input type="checkbox" id="s2" ${S.hideTicks?'':'checked'}></label>
  <div class="sec">المظهر</div><label class="sw"><div><b>الوضع الليلي</b></div><input type="checkbox" id="s3" ${document.documentElement.dataset.theme==='dark'?'checked':''}></label>${extra()}`;
  $('#s1').onchange=e=>{S.hideSeen=e.target.checked;hdr()};

(function(){

function ai(t){
  const q=t.trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  if(/^[\d\s+\-*/().]+$/.test(q)&&/\d/.test(q)){try{const v=Function('"use strict";return ('+q+')')();if(isFinite(v))return 'الناتج: '+nfa(+v.toFixed(6))}catch(e){}}

  if(/الساعة|الوقت/.test(q))return 'الساعة الآن '+now();
  if(/التاريخ|النهاردة|اليوم/.test(q))return new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(/نكتة|نكته/.test(q))return ['مبرمج دخل مطعم وطلب كوباية ماء، فقالوله: حاضر. فرد: لا، أنا قصدي bool.','واحد نسي الباسورد، فكتب: نسيت الباسورد. اتفتح الحساب.','قالوا للمبرمج: اطلع بره الصندوق. فقال: الـ scope مش بتاعي.'][Math.floor(Math.random()*3)];
  if(/شكر/.test(q))return 'العفو، في أي وقت.';
  return 'وصلتني رسالتك. أنا مساعد محلي داخل الصفحة، بفهم الوقت والتاريخ والحساب والنكت.';
}
